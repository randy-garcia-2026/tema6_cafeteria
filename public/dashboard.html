<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kōhi — Mi panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="logo small"><a href="index.html">Kōhi</a></div>
    <div class="divider"></div>
    <p class="msg error" id="msg"></p>

    <section id="panel" hidden>
      <h1 id="greeting"></h1>
      <p class="lead">Gracias por esperar con nosotros.</p>

      <div class="card">
        <p class="position" id="position"></p>
        <div class="progress"><div class="progress-bar" id="bar"></div></div>
        <p class="progress-label" id="label"></p>
      </div>

      <div class="card">
        <div class="qr" id="qr"></div>
        <p class="qr-note">Tu código de acceso (ficticio)</p>
      </div>

      <button class="logout" id="logout">CERRAR SESIÓN</button>
    </section>
  </main>

  <script>
    const token = localStorage.getItem('kohi_token');
    const msg = document.getElementById('msg');

    function goLogin() { localStorage.removeItem('kohi_token'); window.location.href = 'login.html'; }

    document.getElementById('logout').addEventListener('click', goLogin);

    async function load() {
      if (!token) return goLogin();
      try {
        const res = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) return goLogin();   // token inválido o expirado
        const u = await res.json();
        if (!res.ok) throw new Error(u.error);

        document.getElementById('greeting').textContent = 'Hola, ' + u.name;
        document.getElementById('position').textContent = `Eres el #${u.position} de ${u.total}`;
        document.getElementById('qr').textContent = 'QR-' + String(u.id).padStart(4, '0');

        // Progreso: cuanto más cerca del #1, más llena la barra
        const pct = u.total > 1 ? Math.round(((u.total - u.position) / (u.total - 1)) * 100) : 100;
        document.getElementById('label').textContent =
          u.position === 1 ? 'Eres el primero en la fila' : `${u.position - 1} persona(s) delante de ti`;
        document.getElementById('panel').hidden = false;
        setTimeout(() => { document.getElementById('bar').style.width = Math.max(pct, 4) + '%'; }, 100);
      } catch {
        msg.textContent = 'No se pudo cargar tu información. Inténtalo de nuevo.';
      }
    }
    load();
  </script>
</body>
</html>
